        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: page_size
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Id:
      name: id
      in: path
      required: true
      description: Mã định danh bản ghi
      schema:
        type: integer
        format: int64
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    Format:
      name: format
      in: query
      schema:
        type: string
        enum:
        - json
        - xlsx
        - pdf
        default: json
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Chuỗi duy nhất cho mỗi lần thu (khuyến nghị UUID v4)
      schema:
        type: string
        minLength: 8
        maxLength: 100
  responses:
    BadRequest:
      description: Lỗi dữ liệu đầu vào (`VALIDATION_ERROR`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Chưa xác thực hoặc token hết hạn (`UNAUTHENTICATED`, `INVALID_CREDENTIALS`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Sai vai trò (`FORBIDDEN`) hoặc phải đổi mật khẩu (`PASSWORD_CHANGE_REQUIRED`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Không tìm thấy (`NOT_FOUND`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Locked:
      description: Tài khoản đang bị khóa tạm thời (`ACCOUNT_LOCKED`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ImportFailed:
      description: File import có lỗi, đã rollback (`IMPORT_FAILED`); `details` liệt kê lỗi theo dòng
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Lỗi hệ thống
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    UserPage:
      allOf:
      - $ref: '#/components/schemas/PageMeta'
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/User'
    AuditLogPage:
      allOf:
      - $ref: '#/components/schemas/PageMeta'
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/AuditLog'
    BackupJobPage:
      allOf:
      - $ref: '#/components/schemas/PageMeta'
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/BackupJob'
    ApartmentPage:
      allOf:
      - $ref: '#/components/schemas/PageMeta'
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/Apartment'
    HouseholdPage:
      allOf:
      - $ref: '#/components/schemas/PageMeta'
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/Household'
    ResidentPage:
      allOf:
      - $ref: '#/components/schemas/PageMeta'
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/Resident'
    TemporaryStayPage:
      allOf:
      - $ref: '#/components/schemas/PageMeta'
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/TemporaryStay'
    TemporaryAbsencePage:
      allOf:
      - $ref: '#/components/schemas/PageMeta'
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/TemporaryAbsence'
    PaymentPage:
      allOf:
      - $ref: '#/components/schemas/PageMeta'
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/Payment'
    DonationCampaignPage:
      allOf:
      - $ref: '#/components/schemas/PageMeta'
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/DonationCampaign'
    ChangeRequestPage:
      allOf:
      - $ref: '#/components/schemas/PageMeta'
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/ChangeRequest'
    FeeTypePage:
      allOf:
      - $ref: '#/components/schemas/PageMeta'
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/FeeType'
    FeeExemptionPage:
      allOf:
      - $ref: '#/components/schemas/PageMeta'
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/FeeExemption'
    ServiceProviderPage:
      allOf:
      - $ref: '#/components/schemas/PageMeta'
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/ServiceProvider'
    ProviderSettlementPage:
      allOf:
      - $ref: '#/components/schemas/PageMeta'
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/ProviderSettlement'
    VehiclePage:
      allOf:
      - $ref: '#/components/schemas/PageMeta'
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/Vehicle'
    BillingPeriodPage:
      allOf:
      - $ref: '#/components/schemas/PageMeta'
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/BillingPeriod'
    InvoicePage:
      allOf:
      - $ref: '#/components/schemas/PageMeta'
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/Invoice'
    UtilityReadingPage:
      allOf:
      - $ref: '#/components/schemas/PageMeta'
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/UtilityReading'
    DonationPage:
      allOf:
      - $ref: '#/components/schemas/PageMeta'
      - type: object
        required:
        - items
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/Donation'
    Error:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
          example: VALIDATION_ERROR
        message:
          type: string
        details:
          type: array
          items:
            $ref: '#/components/schemas/ErrorDetail'
    ErrorDetail:
      type: object
      required:
      - message
      properties:
        field:
          type: string
        message:
          type: string
        row:
          type: integer
          description: Số dòng (khi import file)
    PageMeta:
      type: object
      required:
      - page
      - page_size
      - total
      properties:
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
    RoleCode:
      type: string
      enum:
      - ADMIN
      - ACCOUNTANT
      - TREASURER
      - RESIDENT
    Role:
      type: object
      properties:
        id:
          type: integer
        code:
          $ref: '#/components/schemas/RoleCode'
        name:
          type: string
        description:
          type: string
          nullable: true
    LoginRequest:
      type: object
      required:
      - username
      - password
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    LoginResponse:
      type: object
      required:
      - token
      - token_type
      - expires_in
      - user
      properties:
        token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
          description: Số giây token còn hiệu lực
        user:
          $ref: '#/components/schemas/User'
    User:
      type: object
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        full_name:
          type: string
        email:
          type: string
          format: email
          nullable: true
        phone:
          type: string
          nullable: true
        role:
          $ref: '#/components/schemas/Role'
        household_id:
          type: integer
          format: int64
          nullable: true
        is_active:
          type: boolean
        must_change_password:
          type: boolean
        locked_until:
          type: string
          format: date-time
          nullable: true
        last_login_at:
          type: string
          format: date-time
          nullable: true
    UserCreate:
      type: object
      required:
      - username
      - full_name
      - role_id
      properties:
        username:
          type: string
          minLength: 3
        full_name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
        role_id:
          type: integer
          description: Id vai trò nhân sự (không phải RESIDENT)
    UserUpdate:
      type: object
      properties:
        full_name:
          type: string
        email:
          type: string
          format: email
        phone:
          type: string
    UserRoleUpdate:
      type: object
      required:
      - role_id
      properties:
        role_id:
          type: integer
    UserWithTempPassword:
      allOf:
      - $ref: '#/components/schemas/User'
      - type: object
        properties:
          temporary_password:
            type: string
    TempPassword:
      type: object
      required:
      - temporary_password
      properties:
        temporary_password:
          type: string
    ChangePasswordRequest:
      type: object
      required:
      - old_password
      - new_password
      properties:
        old_password:
          type: string
          format: password
        new_password:
          type: string
          format: password
          minLength: 8
    AuditLog:
      type: object
      properties:
        id:
          type: integer
          format: int64
        user_id:
          type: integer
          format: int64
          nullable: true
        action:
          type: string
        entity_type:
          type: string
        entity_id:
          type: string
          nullable: true
        old_value:
          type: object
          nullable: true
        new_value:
          type: object
          nullable: true
        reason:
          type: string
          nullable: true
        ip_address:
          type: string
          nullable: true
        user_agent:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
    BackupJob:
      type: object
      properties:
        id:
          type: integer
          format: int64
        status:
          type: string
          enum:
          - QUEUED
          - RUNNING
          - SUCCEEDED
          - FAILED
        requested_by:
          type: integer
          format: int64
          nullable: true
        requested_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
          nullable: true
        size_bytes:
          type: integer
          format: int64
          nullable: true
    Apartment:
      type: object
      properties:
        id:
          type: integer
          format: int64
        code:
          type: string
        floor:
          type: integer
          minimum: 0
        area_m2:
          type: number
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
        note:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    ApartmentCreate:
      type: object
      required:
      - code
      - floor
      - area_m2
      properties:
        code:
          type: string
        floor:
          type: integer
          minimum: 0
        area_m2:
          type: number
          minimum: 0
          exclusiveMinimum: true
          description: Diện tích > 0 (AC-01.1)
        note:
          type: string
    ApartmentUpdate:
      type: object
      properties:
        floor:
          type: integer
          minimum: 0
        area_m2:
          type: number
          minimum: 0
          exclusiveMinimum: true
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
        note:
          type: string
    Household:
      type: object
      properties:
        id:
          type: integer
          format: int64
        household_code:
          type: string
        status:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
        contact_phone:
          type: string
          nullable: true
        contact_email:
          type: string
          nullable: true
        note:
          type: string
          nullable: true
        apartment_id:
          type: integer
          format: int64
          nullable: true
        apartment_code:
          type: string
          nullable: true
        floor:
          type: integer
          nullable: true
        area_m2:
          type: number
          nullable: true
        head_resident_id:
          type: integer
          format: int64
          nullable: true
        head_name:
          type: string
          nullable: true
        head_phone:
          type: string
          nullable: true
        member_count:
          type: integer
        created_at:
