openapi: 3.0.3
info:
  title: BlueMoon API
  version: 1.1.0
  description: |-
    Hợp đồng API của phần mềm quản lý và thu phí chung cư **Blue Moon** (Nhóm 18).
    Thiết kế bám theo 47 User Story trong Kế hoạch dự án và khớp với CSDL `01_schema.sql`.
    Mỗi thao tác có `x-user-stories` (truy vết về US) và `x-roles` (vai trò được phép gọi).

    ## Quy ước chung
    - **Base URL** `/api/v1`. Dữ liệu JSON, UTF-8, tên trường `snake_case`.
    - **Xác thực** bằng JWT: header `Authorization: Bearer <token>`. Mọi endpoint đều cần token, trừ `POST /auth/login`.
    - **Tiền** là số nguyên `int64`, đơn vị VNĐ (CSDL lưu `numeric(14,2)` nhưng luôn là số chẵn đồng). Server làm tròn đến đồng khi tính phí. Ngoại lệ duy nhất: `discount_value` của miễn giảm `PERCENT` (0-100, có thể lẻ).
    - **Ngày** dạng `YYYY-MM-DD`; **thời điểm** dạng ISO 8601 có múi giờ (`2026-11-05T09:30:00+07:00`).
    - **Phân trang** bằng `page` (từ 1) và `page_size` (mặc định 20, tối đa 100). Mọi danh sách trả về `{items, page, page_size, total}`.
    - **Xuất file**: tham số `format` nhận `json` (mặc định), `xlsx`, `pdf`. File trả về dạng nhị phân kèm `Content-Disposition`.
    - **Không xóa vật lý**: thao tác "xóa" là xóa logic, "hủy", hoặc "ngừng áp dụng".
    - **Danh tính người thao tác** (`collected_by`, `created_by`, `approved_by`, `recorded_by`...) luôn lấy từ token, không nhận từ client.
    - **Idempotency**: `POST /payments` bắt buộc có header `Idempotency-Key` để bấm đúp không tạo hai biên lai. Server cần lưu key (kèm mã băm nội dung) cùng biên lai.

    ## Lỗi
    Mọi lỗi trả về cùng một cấu trúc `Error`. Mọi endpoint (trừ login) đều khai báo `401`, `403`, `500`; `403` đồng thời ghi audit log `ACCESS_DENIED`.

    | HTTP | `code` | Ý nghĩa |
    |---|---|---|
    | 400 | `VALIDATION_ERROR`, `WRONG_OLD_PASSWORD` | Dữ liệu sai định dạng, `details` chỉ rõ từng trường |
    | 401 | `UNAUTHENTICATED`, `INVALID_CREDENTIALS` | Chưa đăng nhập / sai mật khẩu |
    | 403 | `FORBIDDEN`, `PASSWORD_CHANGE_REQUIRED` | Sai quyền / phải đổi mật khẩu lần đầu |
    | 404 | `NOT_FOUND` | Không có bản ghi (cư dân gọi dữ liệu hộ khác nhận 404, chống IDOR) |
    | 409 | mã cụ thể, ví dụ `DUPLICATE_CCCD`, `DUPLICATE_APARTMENT_CODE`, `HEAD_ALREADY_EXISTS`, `DEBT_NOT_SETTLED`, `PERIOD_HAS_PAYMENTS`, `PERIOD_CLOSED`, `RATE_OVERLAP`, `IDEMPOTENCY_KEY_REUSED`, `ALREADY_CANCELLED` | Vi phạm ràng buộc nghiệp vụ; danh sách mã có thể gặp ghi ở từng thao tác |
    | 422 | `IMPORT_FAILED` | File import có dòng lỗi, đã rollback toàn bộ |
    | 423 | `ACCOUNT_LOCKED` | Sai mật khẩu 5 lần, khóa 15 phút (AC-28.2) |

    ## Ma trận phân quyền (RBAC)
    Hệ thống có 4 vai trò: `ADMIN` (Quản trị hệ thống kiêm Ban quản trị - BQT), `ACCOUNTANT` (Kế toán), `TREASURER` (Thủ quỹ), `RESIDENT` (Cư dân).
    Cư dân **chỉ** gọi các endpoint `/portal/*`; định danh hộ lấy từ token, không nhận `household_id` từ client (chống IDOR, AC-44.2).

    | Nhóm chức năng | ADMIN | ACCOUNTANT | TREASURER | RESIDENT |
    |---|:-:|:-:|:-:|:-:|
    | Người dùng, phân quyền, audit log, sao lưu | ✔ | | | |
    | Căn hộ, hộ, nhân khẩu, biến động, tạm trú/vắng, phương tiện | ✔ | xem | | |
    | Import dữ liệu, duyệt đề nghị chỉnh sửa | ✔ | | | |
    | Danh mục khoản thu, đơn giá, miễn giảm, thu hộ, kỳ thu, chỉ số điện nước | ✔ | ✔ | | |
    | Thu tiền, xem và in biên lai | | ✔ | ✔ | |
    | Hủy biên lai | ✔ | ✔ | | |
    | Quỹ vận động tự nguyện | ✔ | ✔ | ✔ | |
    | Báo cáo công nợ và doanh thu | ✔ | ✔ | | |
    | Báo cáo nhân khẩu, dashboard | ✔ | | | |
    | Cổng cư dân `/portal/*` | | | | ✔ |
  contact:
    name: Nhóm 18 - BlueMoon
servers:
- url: http://localhost:8000/api/v1
  description: Môi trường phát triển Backend (FastAPI mặc định)
- url: http://localhost:8080/api/v1
  description: Môi trường phát triển qua Proxy / Nginx / Docker
tags:
- name: Auth
  description: Đăng nhập, đăng xuất, đổi mật khẩu
- name: Users
  description: Tài khoản và phân quyền
- name: System
  description: Nhật ký thao tác, sao lưu
- name: Apartments
  description: Căn hộ
- name: Households
  description: Hộ gia đình
- name: Residents
  description: Nhân khẩu và biến động
- name: Temporary stays
  description: Tạm trú, tạm vắng
- name: Import
  description: Nhập dữ liệu từ Excel
- name: Portal
  description: Cổng cư dân (chỉ RESIDENT)
- name: Change requests
  description: Duyệt đề nghị chỉnh sửa từ cư dân
- name: Fee catalog
  description: Khoản thu, đơn giá, miễn giảm
- name: Service providers
  description: Thu hộ và đối soát nhà cung cấp
- name: Vehicles
  description: Phương tiện
- name: Billing
  description: Kỳ thu, giấy báo, chỉ số điện nước
- name: Cashier
  description: Thu ngân, biên lai
- name: Donations
  description: Quỹ vận động tự nguyện
- name: Search & Reports
  description: Tìm kiếm, báo cáo, dashboard
security:
- bearerAuth: []
paths:
  /auth/login:
    post:
      tags:
      - Auth
      summary: Đăng nhập
      operationId: login
      description: Sai mật khẩu 5 lần liên tiếp thì khóa 15 phút (AC-28.2). Nếu `user.must_change_password = true`,
        client phải đổi mật khẩu trước khi dùng các endpoint khác.
      security: []
      x-user-stories:
      - US-28
      x-roles:
      - public
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Đăng nhập thành công
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '423':
          $ref: '#/components/responses/Locked'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/logout:
    post:
      tags:
      - Auth
      summary: Đăng xuất
      operationId: logout
      description: Server đưa token vào danh sách thu hồi (blacklist) đến khi token hết hạn.
      x-user-stories:
      - US-28
      x-roles:
      - all
      responses:
        '204':
          description: Đã đăng xuất
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/me:
    get:
      tags:
      - Auth
      summary: Thông tin tài khoản đang đăng nhập
      operationId: getMe
      x-user-stories:
      - US-28
      x-roles:
      - all
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/change-password:
    post:
      tags:
      - Auth
      summary: Đổi mật khẩu cá nhân
      operationId: changePassword
      description: Cho phép cả khi đang ở trạng thái `PASSWORD_CHANGE_REQUIRED`. Sai mật khẩu cũ trả `400 WRONG_OLD_PASSWORD`
        (không dùng 401 để tránh client tự đăng xuất).
      x-user-stories:
      - US-29
      x-roles:
      - all
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Đã đổi mật khẩu
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /roles:
    get:
      tags:
      - Users
      summary: Danh sách vai trò
      operationId: listRoles
      x-user-stories:
      - US-31
      x-roles:
      - ADMIN
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Role'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /users:
    get:
      tags:
      - Users
      summary: Danh sách tài khoản
      operationId: listUsers
      x-user-stories:
      - US-30
      x-roles:
      - ADMIN
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: q
        in: query
        schema:
          type: string
        description: Tìm theo username, họ tên
      - name: role
        in: query
        schema:
          $ref: '#/components/schemas/RoleCode'
      - name: is_active
        in: query
        schema:
          type: boolean
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
      - Users
      summary: Tạo tài khoản nhân sự
      operationId: createUser
      description: Chỉ tạo tài khoản nhân sự (ADMIN, ACCOUNTANT, TREASURER). Tài khoản `RESIDENT` do hệ thống tự
        sinh khi tạo hộ (D-12).
      x-user-stories:
      - US-30
      x-roles:
      - ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '201':
          description: Đã tạo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserWithTempPassword'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 'Xung đột nghiệp vụ. Mã `code` có thể gặp: `DUPLICATE_USERNAME`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /users/{userId}:
    get:
      tags:
      - Users
      summary: Chi tiết tài khoản
      operationId: getUser
      x-user-stories:
      - US-30
      x-roles:
      - ADMIN
      parameters:
      - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      tags:
      - Users
      summary: Cập nhật thông tin tài khoản
      operationId: updateUser
      x-user-stories:
      - US-30
      x-roles:
      - ADMIN
      parameters:
      - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /users/{userId}/role:
    put:
      tags:
      - Users
      summary: Gán hoặc thu hồi vai trò
      operationId: setUserRole
      description: Không được gán vai trò `RESIDENT` cho tài khoản nhân sự và ngược lại. Ghi audit log.
      x-user-stories:
      - US-31
      x-roles:
      - ADMIN
      parameters:
      - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRoleUpdate'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'Xung đột nghiệp vụ. Mã `code` có thể gặp: `CANNOT_CHANGE_OWN_ROLE`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /users/{userId}/lock:
    post:
      tags:
      - Users
      summary: Khóa tài khoản
      operationId: lockUser
      x-user-stories:
      - US-30
      x-roles:
      - ADMIN
      parameters:
      - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'Xung đột nghiệp vụ. Mã `code` có thể gặp: `CANNOT_LOCK_SELF`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /users/{userId}/unlock:
    post:
      tags:
      - Users
      summary: Mở khóa tài khoản
      operationId: unlockUser
      x-user-stories:
      - US-30
      x-roles:
      - ADMIN
      parameters:
      - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /users/{userId}/reset-password:
    post:
      tags:
      - Users
      summary: Cấp lại mật khẩu tạm
      operationId: resetUserPassword
      description: Mật khẩu tạm chỉ hiển thị một lần; tài khoản bị buộc đổi mật khẩu ở lần đăng nhập kế tiếp.
      x-user-stories:
      - US-30
      - US-29
      x-roles:
      - ADMIN
      parameters:
      - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TempPassword'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /audit-logs:
    get:
      tags:
      - System
      summary: Xem và lọc nhật ký thao tác
      operationId: listAuditLogs
      x-user-stories:
      - US-32
      x-roles:
      - ADMIN
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: user_id
        in: query
        schema:
          type: integer
          format: int64
      - name: action
        in: query
        schema:
          type: string
      - name: entity_type
        in: query
        schema:
          type: string
      - name: from
        in: query
        schema:
          type: string
          format: date
      - name: to
        in: query
        schema:
          type: string
          format: date
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditLogPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /system/backups:
    post:
      tags:
      - System
      summary: Chạy sao lưu thủ công
      operationId: createBackup
      x-user-stories:
      - US-45
      x-roles:
      - ADMIN
      responses:
        '202':
          description: Đã nhận yêu cầu, sao lưu chạy nền
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupJob'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags:
      - System
      summary: Lịch sử sao lưu
      operationId: listBackups
      x-user-stories:
      - US-45
      x-roles:
      - ADMIN
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackupJobPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /apartments:
    get:
      tags:
      - Apartments
      summary: Danh sách căn hộ
      operationId: listApartments
      x-user-stories:
      - US-01
      x-roles:
      - ADMIN
      - ACCOUNTANT
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PageSize'
      - name: floor
        in: query
        schema:
          type: integer
      - name: status
        in: query
        schema:
          type: string
          enum:
          - ACTIVE
          - INACTIVE
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApartmentPage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags:
      - Apartments
      summary: Tạo căn hộ mới
      operationId: createApartment
      x-user-stories:
      - US-01
      x-roles:
      - ADMIN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApartmentCreate'
      responses:
        '201':
          description: Đã tạo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Apartment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 'Xung đột nghiệp vụ. Mã `code` có thể gặp: `DUPLICATE_APARTMENT_CODE`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalError'
  /apartments/{id}:
    get:
      tags:
      - Apartments
      summary: Chi tiết căn hộ
      operationId: getApartment
      x-user-stories:
      - US-01
      x-roles:
      - ADMIN
      - ACCOUNTANT
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: OK
